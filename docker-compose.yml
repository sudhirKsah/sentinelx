  #   volumes:
  #     - ./detection-engine:/app
  #   networks:
  #     - sentinelx

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/node_modules:/app/node_modules
    command: npm run dev
    networks:
      - sentinelx

networks:
  sentinelx:
    driver: bridge

volumes:
  postgres_data:
    driver: local
